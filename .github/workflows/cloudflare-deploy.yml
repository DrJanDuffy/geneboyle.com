name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Vercel is the primary host. @cloudflare/next-on-pages requires
    # `export const runtime = 'edge'` on every dynamic route, which conflicts
    # with the Flask `/api` app and Node-oriented API handlers. Treat CF Pages
    # build failures as soft until a dedicated Edge/OpenNext migration.
    outputs:
      pages_ok: ${{ steps.status.outputs.ok }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # package.json pins packageManager=npm — do not enable Corepack/pnpm here.
      # @cloudflare/next-on-pages runs via npx/npm (build:cloudflare).

      # vercel build (used by @cloudflare/next-on-pages) packages the Flask API
      # and now requires Astral's uv on PATH (https://vercel.link/python-version).
      - name: Install uv (Vercel Python runtime)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        id: build
        continue-on-error: true
        run: npm run build:cloudflare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_REALSCOUT_AGENT_ID: ${{ secrets.NEXT_PUBLIC_REALSCOUT_AGENT_ID }}

      - name: Deploy to Cloudflare Pages
        id: pages
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=heyberkshire-com --branch=${{ github.ref_name }}

      - name: Record Pages deploy status
        id: status
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages deploy succeeded."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages build/deploy failed (expected until Edge/OpenNext migration). Vercel remains primary."
          fi

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request' && steps.status.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const deploymentUrl = `https://${branch}.heyberkshire-com.pages.dev`;

            const comment = `## 🚀 Cloudflare Pages Deployment

            ✅ **Preview URL:** ${deploymentUrl}

            ### Quick Links
            - 📱 [Mobile Test](https://mobilemoxie.com/tools/mobile-test/?url=${deploymentUrl})
            - 🔍 [Page Speed](https://pagespeed.web.dev/analysis?url=${deploymentUrl})
            - ♿ [Accessibility](https://wave.webaim.org/report#/${deploymentUrl})

            ---
            *Deployed with Cloudflare Pages • Commit: ${context.sha.substring(0, 7)}*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.deploy.outputs.pages_ok == 'true'
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  performance-audit:
    name: Cloudflare Performance Audit
    runs-on: ubuntu-latest
    needs: deploy
    # Gate on real Pages success output (not job result — soft build failures
    # still mark the deploy job successful so the PR check stays green).
    if: github.event_name == 'pull_request' && needs.deploy.outputs.pages_ok == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://${{ github.event.pull_request.head.ref }}.heyberkshire-com.pages.dev
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Performance Results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            let comment = `## 📊 Cloudflare Pages Performance Report\n\n`;
            comment += `Lighthouse audit completed for Cloudflare deployment.\n\n`;
            comment += `View detailed results in Actions artifacts.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
